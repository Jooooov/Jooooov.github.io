# Publica o site no GitHub Pages a cada push para main.
# Substitui o "Deploy from a branch". A 2026-10-07 dois pushes não dispararam publicação (causa desconhecida); aqui cada execução fica visível em Actions.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Juntar só os ficheiros públicos
        run: mkdir _site && cp index.html _site/ && cp -r assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
